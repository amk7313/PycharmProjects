 Beauty","symbol":"health_and_beauty"},"twisterVariations":{"dimensionKeys":[{"symbol":"style_name","displayString":"Style Name"}],"hasVariations":true},"hasTwisterVariations":true,"featureBullets":["The Perfect Hustler &amp; GenZ Approved: Whether you’re just trimming your beard, cleaning up the edges, or going for a total reset - the OneBlade handles it all. It’s built with a fast-moving cutter that glides through hair without tugging or pulling. Perfectly safe for acne-prone and sensitive skin too. Pro tip: It’s designed to stay slightly off your skin, which means you get a clean look without the &quot;&quot;razor burn&quot;&quot; drama of a manual blade.","Flexible Where It Matters: The dual-sided blade lets you move in any direction without any fear of nicks, cuts or post shave irritation. Get those crisp edges and perfect lineups in literally seconds—no &quot;whoops&quot; moments included","Choose Your Vibe (1mm, 3mm, or 5mm): Whether you want that &quot;&quot;I just woke up like this&quot;&quot; stubble or a more intentional groomed look, we’ve got you with multiple comb options 1mm: For the subtle 5 o’clock shadow 3mm: For a tight, clean trim 5mm: For a chill, longer-stubble aesthetic","Shower Ready &amp; Super Low Maintenance: The OneBlade is 100% waterproof (IPX7), so you can use it wet or dry, with foam or without. When you’re done, just rinse it under the tap. No complicated cleaning kits required.","Perfect Travel Partner: We ditched the bulky, proprietary plugs. This OneBlade charges via USB-A, so you can juice it up using your laptop, power bank, or regular charger. Plus, it comes with a protective cap so you can toss it in your gym bag or backpack without any stress. And yes, it&#39;s absolutely check-in bag safe!","Set It and Forget It: A single blade stays sharp for up to 4 months and can be easily replaced"],"links":[{"url":"/Philips-Technology-Protection-adjustable-QP2724/dp/B0CRF6NJC3"}],"productCategory":{"glProductGroup":{"symbol":"gl_personal
